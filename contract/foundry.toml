[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

remappings = [
  "alkahest/=lib/alkahest/contracts/src/",
  "@eas/=lib/alkahest/contracts/lib/eas-contracts/contracts/",
  "@openzeppelin/contracts/=lib/alkahest/contracts/lib/openzeppelin-contracts/contracts/"
]