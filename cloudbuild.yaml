# Cloud Build configuration for deploying Oracle to Cloud Run
steps:
  # Build the Docker image
  # Using BUILD_ID as tag (always available in Cloud Build, unique per build)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '${_MEMORY}'
      - '--cpu'
      - '${_CPU}'
      - '--timeout'
      - '${_TIMEOUT}'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--min-instances'
      - '${_MIN_INSTANCES}'
      - '--set-secrets'
      - 'PRIVATE_KEY=oracle-private-key:latest,RPC_URL=oracle-rpc-url:latest,ADDRESS=oracle-address:latest,NETWORK=oracle-network:latest,COMMIT_OBLIGATION_ADDRESS=oracle-commit-obligation-address:latest,GIT_IDENTITY_REGISTRY_ADDRESS=oracle-git-identity-registry-address:latest,GITHUB_TOKEN=github-token:latest'

# Substitutions (can be overridden via gcloud builds submit)
# Note: _TAG is optional - if not provided, BUILD_ID will be used automatically
substitutions:
  _REGION: 'asia-southeast1'
  _REPO_NAME: 'git-commit-trading-images'
  _SERVICE_NAME: 'git-escrows-oracle'
  _MEMORY: '2Gi'
  _CPU: '2'
  _TIMEOUT: '900'
  _MAX_INSTANCES: '10'
  _MIN_INSTANCES: '0'

# Images to be pushed to the registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'

# Options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  # Ensure builds run in the same region as the Artifact Registry
  substitution_option: 'ALLOW_LOOSE'

timeout: '1200s'

# IMPORTANT: When submitting builds, specify the region to match your Artifact Registry:
# gcloud builds submit --region=asia-southeast1 --config=cloudbuild.yaml
# Or use the deploy script: ./scripts/deploy.sh --project-id PROJECT_ID --region asia-southeast1

